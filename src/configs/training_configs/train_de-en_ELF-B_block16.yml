# Phase 1: block-to-block (fixed-commitment) revelation, WMT14 De-En, commit size b=16.
# Same task/encoder/architecture as train_de-en_ELF-B.yml; only the denoiser training
# objective changes (teacher-forced committed prefix + active-only noise/loss — see
# utils/block_utils.py and train_step.py). Batch/epoch settings are scaled down for a
# 2x A40 (46GB) sanity run rather than the paper's TPU v5p-64 setup.

# Dataset
data_path: "embedded-language-flows/wmt14_de-en_train_t5"
eval_data_path: "embedded-language-flows/wmt14_de-en_validation_t5"
max_length: 128
max_input_length: 64
pad_token: eos

# Encoder
encoder_model_name: t5-small
encoder_checkpoint: "embedded-language-flows/t5_small_encoder_jax/t5_small_encoder_jax.pkl"
latent_mean: 0.0
latent_std: 0.2

# Model architecture
model: ELF-B  # ELF-B, ELF-M
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4

# Denoiser objective
denoiser_p_mean: -1.5
denoiser_p_std: 0.8
denoiser_noise_scale: 2.0
t_eps: 0.05
time_schedule: "logit_normal"

# Block-to-block (fixed-commitment) revelation — Adaptive BlockFlow Stage 1
use_block_revelation: true
block_size: 16

# Decoder objective
decoder_prob: 0.2
decoder_noise_scale: 1.0
decoder_p_mean: 0.8
decoder_p_std: 0.8

# Conditioning / CFG
label_drop_prob: 0.1
self_cond_prob: 0.5

# Committed-context corruption (opt-in, conditional-only -- see config.py's docstring):
# the prior run's BLEU peaked early (step 6000, BLEU 10.26) then declined and
# plateaued around BLEU~5.2-5.6 from step 20000 through 94000+ (75k steps, no
# recovery) -- training loss plateaued at the same point, confirming the model
# converges to a genuinely different, stable optimum under the teacher-forced
# objective, one that's worse for real (self-generated-prefix) inference than the
# transient state it passed through early on. This perturbs the committed target's
# clean context with Gaussian noise 30% of the time, simulating the imperfect
# self-generated prefix inference actually sees, to reduce that train/inference
# mismatch. latent_std=0.2 above, so noise_scale=0.1 is a moderate (50%-of-std)
# perturbation -- not yet ablated against other scales.
committed_corrupt_prob: 0.3
committed_corrupt_noise_scale: 0.1

# Training (optimizer + schedule) — originally scaled for 2x A40 (~27GB/GPU target,
# global_batch_size=64); re-tuned for 2x H100 (80GB). global_batch_size=256 measured
# ~40GB/38GB per GPU; 512 OOM'd immediately (tried to allocate ~67GB in a single op,
# memory scales worse than linearly here, likely attention/activation costs). Settled
# on 384 (~64GB/GPU, smoke-tested safe through multiple checkpoint saves) as a good
# aggressive-but-safe point given no one else is on this node. save_freq below is
# unaffected by the batch-size change (fraction-of-epoch, so it still saves every
# ~2000 *examples-equivalent* regardless of batch) -- see eval_freq's own comment for
# why it was switched off the epoch-count convention.
# blr reduced 10x (0.001 -> 0.0001) for this re-launch: the first attempt (blr=0.001,
# effective lr=1.5e-3) showed the warm-started model's translation quality collapsing
# fast and monotonically (BLEU 31.35 baseline -> 12.37 @10k -> 4.82 @20k -> 3.93 @30k
# steps) -- a gradient-magnitude fine-tuning issue distinct from (and in addition to)
# the inference-side masking/CFG bugs fixed in sampling_utils.py/generation_utils.py
# (conditional_gen_fix.md). A much gentler fine-tuning LR should let the model adapt to
# the new block-revelation objective without this catastrophic-forgetting-style
# collapse of its already-strong warm-started translation ability.
# epochs cut from 20 -> 3 and lr_schedule switched constant -> cosine: the prior run's
# useful signal was entirely within step 6000-20000 (well under 2 of the original 20
# epochs, steps_per_epoch=11741) before plateauing for 75k+ more steps at constant
# lr=1.5e-4. A cosine decay over a much shorter 3-epoch (35223-step) budget should let
# the model settle near the early-peak region instead of a sustained full-strength LR
# pushing it past into the worse, plateaued optimum.
epochs: 3
global_batch_size: 384
blr: 0.0001
lr_schedule: cosine
weight_decay: 0.0
warmup_steps: 500
optimizer: muon

# EMA
ema_decay1: 0.9999

# Sampling
sampling_configs_path: "configs/sampling_configs/cond_sampling_configs.yml"
num_samples: 64

# Logging & Checkpointing
# save_freq is a fraction-of-epoch; steps_per_epoch = 4508785 // 64 = 70449, so
# 2000 / 70449 ≈ 0.0283876 saves a checkpoint roughly every 2000 steps. At
# global_batch_size=384, steps_per_epoch=11741, so save_freq's SAME fraction now means
# every ~333 raw steps -- equivalent in examples-seen terms, so left unchanged.
# eval_freq switched from the original epoch-count convention (every 5 epochs) to a
# fractional-epoch value; tightened from "every ~10000 steps" to "every ~2000 steps"
# (matching save_freq's cadence) for finer-grained BLEU tracking given training quality
# has been unstable (see best-checkpoint tracking in train.py -- _seed_best_bleu /
# _maybe_save_best's bleu branch): 2000 / 11741 ≈ 0.170343.
log_freq: 10
save_freq: 0.0283876
eval_freq: 0.170343

# Output
output_dir: "/scratch/khiem.tran@ad.wsu.edu/elf_block/outputs/elf_b-wmt-de-en-block16"
hf_repo_id: null
resume: null
# Warm-start from the existing pretrained (non-block-revelation) ELF-B WMT14 de-en
# checkpoint, same approach as OWT's warm-start (see train_owt_ELF-B_block16.yml).
# Verified genuinely trained: step=880600, epoch=100 (matches train_de-en_ELF-B.yml's
# epochs=100), not a random-init artifact. Same architecture as this block16 config
# (ELF-B, bottleneck_dim=128, num_time_tokens=4, etc.), so only params/ema_params1 are
# loaded; step/epoch/opt_state stay fresh.
warm_start_checkpoint: "/home.na1/ad.wsu.edu/khiem.tran/pvt/checkpoints/ELF-B-de-en/checkpoint_0"

# Wandb
use_wandb: false
wandb_project: elf
wandb_entity:
wandb_run_name: elf_b-wmt-de-en-block16

# Misc
seed: 42
